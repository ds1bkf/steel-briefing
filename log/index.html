  var f=document.getElementById("f"), pw=document.getElementById("pw"), btn=document.getElementById("btn"), msg=document.getElementById("msg");
  async function tryDecrypt(pass){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64buf(SALT_B64), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);

  }
