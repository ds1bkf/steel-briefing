name: 기기용 카운터 갱신

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-json
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 카운터 조회 및 파일 생성
        run: python tools/make_device_json.py

      - name: 커밋
        run: |
          git config user.email "ds1bkf@gmail.com"
          git config user.name "ds1bkf"
          git add log/ad8a78f70dfa3cae4dd28b92.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "기기용 카운터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
